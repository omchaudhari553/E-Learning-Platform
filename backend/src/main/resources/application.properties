spring.application.name=FinalProject

# =========================
# SERVER CONFIG
# =========================
server.port=${PORT:8080}
server.address=0.0.0.0
server.ssl.enabled=false

# =========================
# DATABASE CONFIG (local defaults; prod uses MYSQLHOST / MYSQL_URL via DatabaseUrlEnvironmentPostProcessor)
# =========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.db.enabled=false
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =========================
# JPA CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================
# CORS CONFIG
# =========================
spring.mvc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ai-powered-shopping-plaftform.vercel.app,http://localhost:4200,https://localhost:4200}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# =========================
# SECURITY HEADERS
# =========================
security.headers.frame-options=DENY
security.headers.content-type-options=nosniff

# =========================
# RAZORPAY CONFIG
# =========================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.company.name=Cara
razorpay.test.mode=true

# =========================
# FILE UPLOAD
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# OPENAI CONFIG (IMPORTANT FIX)
# =========================
openai.api.key=${OPENAI_API_KEY:}
